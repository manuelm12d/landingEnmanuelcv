name: Deploy to Firebase Hosting - SecOps Optimized

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: firebase-hosting-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security_build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      # 1. CHECKOUT CON HASH PINNING (Mitigación de cadena de suministro en Actions)
      - name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      # 2. ESCANEO DE SECRETOS (SAST Temprano)
      # Falla el pipeline si alguien hardcodeó un token o API Key en los commits.
      - name: Gitleaks (Secret Scanning)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3. SETUP NODE CON HASH PINNING
      - name: Setup Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: 22
          cache: npm

      # 4. INSTALACIÓN ESTRICTA (Sin resolución dinámica de dependencias)
      - name: Install dependencies
        run: npm ci

      # 5. ANÁLISIS DE COMPOSICIÓN DE SOFTWARE (SCA - OWASP A06) (Software Composition Analysis)
      # Audita el package-lock.json. Rompe el pipeline si hay vulnerabilidades Altas o Críticas.
      - name: Audit Dependencies
        run: npm audit --audit-level=high

      # 6. INYECCIÓN SEGURA DE VARIABLES DE ENTORNO
      - name: Create .env.production
        run: |
          cat > .env.production << EOF
          VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID=${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          EOF

      # 7. CONSTRUCCIÓN Y PRUEBAS (Quality Gate)
      # Idealmente, si tienes ESLint configurado, inclúyelo aquí para mantener el estándar de código.
      - name: Build project
        run: npm run build

      # 8. DESPLIEGUE A FIREBASE (Hash Pinning)
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@4d1b6f9e612ebf11181f9b36ed75497298634812 # v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: enmanuelreyes-lead-developer
          channelId: live