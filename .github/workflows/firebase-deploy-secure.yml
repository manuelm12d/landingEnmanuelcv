name: Deploy to Firebase Hosting - SecOps Optimized

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: firebase-hosting-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security_build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # 1. CHECKOUT CON HASH PINNING (Mitigación de cadena de suministro en Actions)
      # fetch-depth 0 para que Gitleaks pueda ver el historial del push.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # 2. ESCANEO DE SECRETOS
      # v3 corre en Node 24. v2 declara Node 20, que los runners ya no ejecutan de forma nativa.
      - name: Gitleaks (Secret Scanning)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3. SETUP NODE CON HASH PINNING
      # .nvmrc fija la línea LTS (24). check-latest evita usar un 24.x viejo del caché
      # del runner y toma el último parche de seguridad (>= 24.22.3).
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm

      # 4. INSTALACIÓN ESTRICTA (Sin resolución dinámica de dependencias)
      - name: Install dependencies
        run: npm ci

      # 5. ANÁLISIS DE COMPOSICIÓN DE SOFTWARE (SCA)
      # Bloquea el deploy si una dependencia de producción tiene un aviso high o critical.
      # firebase-tools es devDependency (CLI local) y no llega al sitio publicado.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # 6. INYECCIÓN SEGURA DE VARIABLES DE ENTORNO
      # Falla antes del build si falta un secreto obligatorio: si no, Vite publica
      # un sitio sin Firebase y el deploy igual saldría en verde.
      - name: Create .env.production
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
        run: |
          missing=0
          for name in \
            VITE_FIREBASE_API_KEY \
            VITE_FIREBASE_AUTH_DOMAIN \
            VITE_FIREBASE_PROJECT_ID \
            VITE_FIREBASE_STORAGE_BUCKET \
            VITE_FIREBASE_MESSAGING_SENDER_ID \
            VITE_FIREBASE_APP_ID
          do
            if [ -z "${!name}" ]; then
              echo "::error title=Secreto faltante::$name está vacío. Agrégalo en Settings → Secrets and variables → Actions."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          cat > .env.production << EOF
          VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY}
          VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN}
          VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID}
          VITE_FIREBASE_STORAGE_BUCKET=${VITE_FIREBASE_STORAGE_BUCKET}
          VITE_FIREBASE_MESSAGING_SENDER_ID=${VITE_FIREBASE_MESSAGING_SENDER_ID}
          VITE_FIREBASE_APP_ID=${VITE_FIREBASE_APP_ID}
          VITE_FIREBASE_MEASUREMENT_ID=${VITE_FIREBASE_MEASUREMENT_ID}
          EOF

      # 7. CONSTRUCCIÓN
      - name: Build project
        run: npm run build

      # 8. DESPLIEGUE A FIREBASE (Hash Pinning)
      # El canal live no crea check runs ni comenta PRs, así que contents: read alcanza.
      - name: Verify service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error title=Secreto faltante::FIREBASE_SERVICE_ACCOUNT está vacío. Debe ser el JSON de la cuenta de servicio de Firebase Hosting."
            exit 1
          fi

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: enmanuelreyes-lead-developer
          channelId: live
